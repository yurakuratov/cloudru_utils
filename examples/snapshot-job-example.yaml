# Run from the repository root:
#   cloudru jobs submit -f examples/snapshot-job-example.yaml --dry-run
# Set your bucket, local/remote AWS profiles, remote HOME, image, and instance type,
# then submit the same file without --dry-run. Remote AWS files must already exist.
# The image needs Bash and AWS CLI. After shell_init/conda activation, the
# environment must provide Python 3.9+ as python (or python3 if python is absent).
snapshot:
  source: .                      # Current terminal directory: this repository.
  output_dir: ./snapshots        # Relative to the terminal directory; excluded from capture.
  use_gitignore: true            # Follow gitignore when snapshot is collected.
  # Keep data and runs excluded when enabling the NFS symlinks below.
  exclude: [data, runs, results, .venv, tmp_scripts]
  max_bytes: 1073741824  # 1Gb

# to reuse snapshots, replace the entire snapshot section with exactly one of:
# snapshot:
#   archive: ./snapshots/project-TIMESTAMP-DIGEST.tar.gz
# snapshot:
#   uri: s3://my-bucket/my-user/snapshots/project-TIMESTAMP-DIGEST.tar.gz
# URI mode needs no s3.local or snapshot_prefix settings.

s3:
  endpoint_url: https://s3.cloud.ru
  snapshot_prefix: s3://my-bucket/my-user/snapshots
  # uncomment this to collect job outputs/artifacts after job is done
  collect_outputs_to: 's3://my-bucket/my-user/outputs/${CLOUDRU_JOB_DIR_NAME}'
  local:
    # profile: default # aws-profile
    # aws_cli: aws
    # config_file: ~/.aws/config
    # credentials_file: ~/.aws/credentials

# list what to collect after job is done; upload it under <destination>/results/.
outputs:
  - '${CLOUDRU_SOURCE_DIR}/results'
  # - '${CLOUDRU_SOURCE_DIR}/runs'
  # - '${CLOUDRU_JOB_DIR}/checkpoints'

setup:
  # Optional: activate an existing environment before downloading the snapshot.
  # shell_init: 'eval "$(conda shell.bash hook)"'
  # conda_env: /home/jovyan/my-user/envs/training
  # Default workdir is ${CLOUDRU_SOURCE_DIR}; pre_command runs before this cd.
  pre_command:
    - 'test -f "$CLOUDRU_SOURCE_DIR/README.md"'
    # Optional: link shared NFS data/results after extraction.
    # Uncomment these commands and the NFS variables below together.
    # Linux ln -sT fails if the destination already exists.
    # - 'test -d "$JOBS_DATA_DIR"'
    # - 'mkdir -p "$JOBS_RUNS_DIR"'
    # - 'ln -sT "$JOBS_DATA_DIR" "$CLOUDRU_SOURCE_DIR/data"'
    # - 'ln -sT "$JOBS_RUNS_DIR" "$CLOUDRU_SOURCE_DIR/runs"'
  print_pwd: true

job:
  # Put command arguments in script; nonempty job.flags is unsupported.
  script: |
    printf 'Snapshot: %s\nJob directory: %s\n' "$CLOUDRU_SNAPSHOT_URI" "$CLOUDRU_JOB_DIR"
    bash examples/example.sh
  base_image: cr.ai.cloud.ru/aicloud-base-images/py3.11-torch2.4.0:0.0.40
  instance_type: a100plus.1gpu.80vG.12C.96G
  region: SR006
  # cloudru allocations use ALLOCATION_ID (alloc-airi-master-jobs-h100-sr006) to set default allocation OR
  # allocation_name: alloc-airi-master-jobs-h100-sr006
  job_type: binary
  job_desc: snapshot-job-example
  n_workers: 1
  processes_per_worker: 1
  env_variables:
    HOME: /home/jovyan/my-user
    MYENVVAR: snapshot-job-example
    # Optional paths for the symlink commands above; replace my-user.
    # JOBS_DATA_DIR: /home/jovyan/my-user/data/my-dataset
    # JOBS_RUNS_DIR: /home/jovyan/my-user/runs/
    # CLOUDRU_JOBS_ROOT: /home/jovyan/my-user/data/jobs
    # managed by cloudru jobs submit and added to job.env_variables:
    #  CLOUDRU_JOB_DIR_NAME, CLOUDRU_JOB_DIR, CLOUDRU_SOURCE_DIR, CLOUDRU_SNAPSHOT_URI
    # Defaults:
    # CLOUDRU_JOBS_ROOT=<HOME>/data/jobs, CLOUDRU_AWS_CLI=aws,
    # AWS_PROFILE=default
    # AWS_CONFIG_FILE=<HOME>/.aws/config,
    # AWS_SHARED_CREDENTIALS_FILE=<HOME>/.aws/credentials.
